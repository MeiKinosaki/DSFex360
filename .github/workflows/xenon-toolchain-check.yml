name: DSFex360 Xenon toolchain check
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/xenon-toolchain-check.yml'
jobs:
  toolchain-smoke:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Install prerequisites
        run: sudo apt-get update && sudo apt-get install -y build-essential flex bison gcc-multilib libgmp-dev libmpfr-dev libmpc-dev texinfo git wget file patch python3
      - name: Fetch libxenon
        run: git clone --depth 1 https://github.com/X360Tools/libxenon.git third_party/libxenon
      - name: Build Xenon toolchain and libraries
        working-directory: third_party/libxenon/toolchain
        env:
          PREFIX: /tmp/devkitxenon
        run: |
          set -o pipefail
          ./build-xenon-toolchain toolchain 2>&1 | tee "$GITHUB_WORKSPACE/toolchain-build.log"
          ./build-xenon-toolchain libxenon 2>&1 | tee -a "$GITHUB_WORKSPACE/toolchain-build.log"
      - name: Verify compiler and compile DSFex360 smoke source
        env:
          DEVKITXENON: /tmp/devkitxenon
        run: |
          set -eu
          export PATH="$DEVKITXENON/bin:$DEVKITXENON/usr/bin:$PATH"
          command -v xenon-gcc | tee toolchain-report.txt
          xenon-gcc --version | head -n 2 | tee -a toolchain-report.txt
          command -v xenon-ld | tee -a toolchain-report.txt
          test -f "$DEVKITXENON/usr/lib/libxenon.a"
          xenon-gcc -Wall -Wextra -Werror -c xenon-test/main.cpp -o xenon-smoke.o
          file xenon-smoke.o | tee -a toolchain-report.txt
      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DSFex360-Xenon-toolchain-report
          path: |
            toolchain-build.log
            toolchain-report.txt
          if-no-files-found: warn
          retention-days: 14
