name: Host tests
on:
  push:
    branches: [main, v0.2b-stage20-snapshot]
  pull_request:
    branches: [main]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler and make
        run: sudo apt-get update && sudo apt-get install -y g++ make
      - name: Run host tests
        run: make test
